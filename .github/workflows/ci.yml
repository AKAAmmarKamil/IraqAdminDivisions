name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore IraqAdminDivisions.slnx
      - run: dotnet build IraqAdminDivisions.slnx -c Release --no-restore
      - run: dotnet test IraqAdminDivisions.slnx -c Release --no-build
      - run: dotnet pack IraqAdminDivisions.slnx -c Release --no-build -o ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/IraqAdminDivisions.Tests/IraqAdminDivisions.Tests.csproj -c Release
